{{ define "demo-banner" }}
{{ if .Demo.Enabled }}
<div class="demo-banner" id="demo-banner">
    {{ template "icon-alert-circle" 14 }}
    <span>Demo: a read-only library of public-domain books. Changes are switched off.</span>
    <button type="button" class="demo-banner-close" data-dismiss-demo-banner aria-label="Dismiss">{{ template "icon-x" 14 }}</button>
</div>
{{ end }}
{{ end }}
