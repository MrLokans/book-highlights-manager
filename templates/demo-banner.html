{{ define "demo-banner" }}
{{ if .Demo.Enabled }}
<div class="demo-banner" id="demo-banner" style="background: var(--color-amber-50, #fffbeb); border-bottom: 1px solid var(--color-amber-200, #fde68a); color: var(--color-amber-800, #92400e); padding: 0.375rem 1rem; font-size: 0.8125rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Demo mode — write operations are disabled</span>
    <button onclick="dismissDemoBanner()" title="Dismiss" style="background: none; border: none; cursor: pointer; color: inherit; font-size: 1rem; line-height: 1; padding: 0 0.25rem; margin-left: 0.5rem;">&times;</button>
</div>
{{ end }}
{{ end }}

{{ define "demo-banner-script" }}
<script>
// Demo banner dismiss
function dismissDemoBanner() {
    const banner = document.getElementById('demo-banner');
    if (banner) {
        banner.style.display = 'none';
        sessionStorage.setItem('demo-banner-dismissed', 'true');
    }
}

// Check if banner was previously dismissed in this session
(function() {
    if (sessionStorage.getItem('demo-banner-dismissed') === 'true') {
        const banner = document.getElementById('demo-banner');
        if (banner) banner.style.display = 'none';
    }
})();
</script>
{{ end }}
